[package]
name = "ribalta-cli"
version = "0.4.0"
description = "The ribalta command: check, format, map and serve the language server for Ribalta files"
readme = "README.md"
keywords = ["ribalta", "visual", "documents", "lsp", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "ribalta_cli"
path = "src/lib.rs"

[[bin]]
name = "ribalta"
path = "src/main.rs"

[dependencies]
ribalta = { path = "../ribalta", version = "0.4.0" }
clap = { version = "4.6", features = ["derive", "env"] }
lsp-server = "0.7"
lsp-types = "0.95"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ribalta-testkit = { path = "../testkit" }
